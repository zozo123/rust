name: EverInit falsify unique-locals

on:
  workflow_dispatch:
  push:
    branches:
      - validation/everinit-ci
      - validation/everinit-falsify-**

permissions:
  contents: read

env:
  BASE_SHA: "09ee43b2d6055539771bee8ac30a6e56eb4db773"

jobs:
  build:
    name: "stage1 ${{ matrix.variant }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [base, candidate]
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/build-stage1.sh ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-${{ matrix.variant }}
          path: stage1-${{ matrix.variant }}.tar.gz

  measure:
    name: "unique n=${{ matrix.n }} inits=${{ matrix.inits_per }}"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        n: [50, 100, 200, 400, 600, 800]
        inits_per: [1, 2, 4]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage1-base
          path: arts
      - uses: actions/download-artifact@v4
        with:
          name: stage1-candidate
          path: arts
      - name: A/B unique locals × multi-init
        run: |
          mkdir -p base cand
          tar -C base -xzf arts/stage1-base.tar.gz
          tar -C cand -xzf arts/stage1-candidate.tar.gz
          python3 <<'PY'
          import json, os, statistics, subprocess, time
          from pathlib import Path
          n, k = int("${{ matrix.n }}"), int("${{ matrix.inits_per }}")
          lines = ["#![allow(unused)]", "fn step(x: u64) -> u64 { x.wrapping_add(1) }", "pub fn probe() -> u64 {"]
          for i in range(n):
              lines.append(f"    let mut x{i}: u64;")
              for j in range(k):
                  lines += ["    loop {", f"        x{i} = step({i+j});", "        break;", "    }"]
          lines += ["    " + " + ".join(f"x{i}" for i in range(n)), "}"]
          Path("case.rs").write_text("\n".join(lines) + "\n")

          def t(rustc):
              out = Path("o.rmeta")
              cmd = [rustc, "--edition", "2021", "--crate-type=lib", "--emit=metadata", "case.rs", "-o", str(out)]
              subprocess.run(cmd, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              s = []
              for _ in range(3):
                  out.unlink(missing_ok=True)
                  t0 = time.perf_counter()
                  subprocess.run(cmd, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  s.append(time.perf_counter() - t0)
              return s

          b, c = t("base/stage1/bin/rustc"), t("cand/stage1/bin/rustc")
          bm, cm = statistics.median(b), statistics.median(c)
          row = {"family": "unique_locals_multi", "n": n, "inits_per": k,
                 "base_median_s": round(bm, 4), "cand_median_s": round(cm, 4),
                 "ratio": round(cm / bm, 4) if bm else None, "saving_s": round(bm - cm, 4),
                 "expect": "ratio~1 when k=1; ratio drops as k grows"}
          Path("result.json").write_text(json.dumps(row, indent=2))
          print(json.dumps(row))
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(
              f"### unique n={n} k={k}\nbase {bm:.3f} cand {cm:.3f} ratio {cm/bm:.3f}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: falsify-${{ matrix.n }}-${{ matrix.inits_per }}
          path: result.json

  report:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: falsify-*
      - name: Summarize falsification
        run: |
          python3 <<'PY'
          import json, os
          from pathlib import Path
          rows = []
          for p in Path("all").rglob("result.json"):
              try:
                  rows.append(json.loads(p.read_text()))
              except Exception:
                  pass
          rows.sort(key=lambda r: (r.get("n", 0), r.get("inits_per", 0)))
          md = ["# Falsify unique-locals", "",
                "Expect: k=1 ratio≈1; larger k → better cand.", "",
                "| n | k | base | cand | ratio |", "| ---: | ---: | ---: | ---: | ---: |"]
          for r in rows:
              md.append(f"| {r['n']} | {r['inits_per']} | {r['base_median_s']} | {r['cand_median_s']} | {r['ratio']} |")
          text = "\n".join(md)
          print(text)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(text)
          Path("falsify-all.json").write_text(json.dumps(rows, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: falsify-aggregate
          path: falsify-all.json
