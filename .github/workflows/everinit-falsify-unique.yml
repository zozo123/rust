# Falsification: many unique locals (one init each).
# Prediction: #160033 ratio ~1.0 — win is NOT full dataflow domain width.
# If ratio ≪ 1 here too, story changes; if ~1 while awaits win, lattice-collapse confirmed.
name: EverInit falsify unique-locals

on:
  workflow_dispatch:
  push:
    branches:
      - validation/everinit-ci
      - validation/everinit-falsify-**

permissions:
  contents: read

jobs:
  build:
    name: "stage1 ${{ matrix.variant }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            sha: "09ee43b2d6055539771bee8ac30a6e56eb4db773"
          - variant: candidate
            sha: "e7339de13da94243e4e0f0ee173be9be44164ab2"
    steps:
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/checkout@v4
        with:
          repository: rust-lang/rust
          ref: ${{ matrix.sha }}
          path: rust
          fetch-depth: 1
      - name: Build stage1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libssl-dev python3 git curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cd rust
          cat > bootstrap.toml <<'TOML'
          change-id = 99999999
          profile = "compiler"
          [llvm]
          download-ci-llvm = true
          [build]
          docs = false
          extended = false
          tools = []
          [rust]
          channel = "dev"
          debug = false
          debuginfo-level = 0
          debuginfo-level-rustc = 0
          debuginfo-level-std = 0
          TOML
          python3 x.py build --stage 1 library -j"$(nproc)"
          tar -C build/host -czf ../stage1-${{ matrix.variant }}.tar.gz stage1
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-${{ matrix.variant }}
          path: stage1-${{ matrix.variant }}.tar.gz

  measure:
    name: "unique n=${{ matrix.n }} inits=${{ matrix.inits_per }}"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        n: [50, 100, 200, 400, 600, 800]
        inits_per: [1, 2, 4]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage1-base
          path: arts
      - uses: actions/download-artifact@v4
        with:
          name: stage1-candidate
          path: arts
      - name: A/B unique locals × multi-init
        run: |
          mkdir -p base cand
          tar -C base -xzf arts/stage1-base.tar.gz
          tar -C cand -xzf arts/stage1-candidate.tar.gz
          python3 <<'PY'
          import json, os, statistics, subprocess, time
          from pathlib import Path
          n = int("${{ matrix.n }}")
          k = int("${{ matrix.inits_per }}")
          # k>1 on same unique local still collapses under Local lattice
          lines = ["#![allow(unused)]","fn step(x: u64) -> u64 { x.wrapping_add(1) }","pub fn probe() -> u64 {"]
          for i in range(n):
              lines.append(f"    let mut x{i}: u64;")
              for j in range(k):
                  lines += ["    loop {", f"        x{i} = step({i+j});", "        break;", "    }"]
          lines += ["    " + " + ".join(f"x{i}" for i in range(n)), "}"]
          Path("case.rs").write_text("\n".join(lines)+"\n")

          def t(rustc):
              out=Path("o.rmeta")
              cmd=[rustc,"--edition","2021","--crate-type=lib","--emit=metadata","case.rs","-o",str(out)]
              subprocess.run(cmd,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              s=[]
              for _ in range(3):
                  out.unlink(missing_ok=True)
                  t0=time.perf_counter()
                  subprocess.run(cmd,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  s.append(time.perf_counter()-t0)
              return s

          b,c=t("base/stage1/bin/rustc"),t("cand/stage1/bin/rustc")
          bm,cm=statistics.median(b),statistics.median(c)
          row={"family":"unique_locals_multi","n":n,"inits_per":k,
               "base_median_s":round(bm,4),"cand_median_s":round(cm,4),
               "ratio":round(cm/bm,4) if bm else None,"saving_s":round(bm-cm,4),
               "expect":"ratio~1 when k=1; ratio drops as k grows (multi InitIndex same Local)"}
          Path("result.json").write_text(json.dumps(row,indent=2))
          print(json.dumps(row))
          open(os.environ["GITHUB_STEP_SUMMARY"],"a").write(
              f"### unique n={n} k={k}\nbase {bm:.3f} cand {cm:.3f} ratio {cm/bm:.3f}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: falsify-${{ matrix.n }}-${{ matrix.inits_per }}
          path: result.json

  report:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: falsify-*
      - name: Summarize falsification
        run: |
          python3 <<'PY'
          import json, os
          from pathlib import Path
          rows=[]
          for p in Path("all").rglob("result.json"):
              try: rows.append(json.loads(p.read_text()))
              except: pass
          rows.sort(key=lambda r:(r.get("n",0), r.get("inits_per",0)))
          md=["# Falsify unique-locals","",
              "Expect: k=1 ratio≈1; larger k → better cand (more InitIndex per Local).","",
              "| n | k | base | cand | ratio |",
              "| ---: | ---: | ---: | ---: | ---: |"]
          for r in rows:
              md.append(f"| {r['n']} | {r['inits_per']} | {r['base_median_s']} | {r['cand_median_s']} | {r['ratio']} |")
          text="\n".join(md)
          print(text)
          open(os.environ["GITHUB_STEP_SUMMARY"],"a").write(text)
          Path("falsify-all.json").write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: falsify-aggregate
          path: falsify-all.json
