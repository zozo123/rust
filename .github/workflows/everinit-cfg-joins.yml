name: EverInit CFG joins A/B

on:
  workflow_dispatch:
  # push disabled: exploratory only; use everinit-valid-ab.yml for pinned A/B

permissions:
  contents: read

env:
  BASE_SHA: "09ee43b2d6055539771bee8ac30a6e56eb4db773"

jobs:
  build:
    name: "stage1 ${{ matrix.variant }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [base, candidate]
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/build-stage1.sh ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-${{ matrix.variant }}
          path: stage1-${{ matrix.variant }}.tar.gz

  measure:
    name: "${{ matrix.family }}/n=${{ matrix.n }}"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        family:
          - diamond_join
          - nested_if
          - match_arms
          - loop_break_continue
          - try_like
          - backedge_reinit
        n: [100, 200, 400, 800, 1200]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage1-base
          path: arts
      - uses: actions/download-artifact@v4
        with:
          name: stage1-candidate
          path: arts
      - name: Generate + time
        run: |
          mkdir -p base cand
          tar -C base -xzf arts/stage1-base.tar.gz
          tar -C cand -xzf arts/stage1-candidate.tar.gz
          python3 <<'PY'
          import json, os, statistics, subprocess, time
          from pathlib import Path
          family, n = "${{ matrix.family }}", int("${{ matrix.n }}")

          def gen():
              if family == "diamond_join":
                  L = ["#![allow(unused)]", "fn step(x:u64)->u64{x.wrapping_add(1)}", "pub fn probe(mut acc:u64, flag:bool)->u64{"]
                  for i in range(n):
                      L += [f"  if flag {{ acc=step(acc.wrapping_add({i})); }} else {{ acc=step(acc.wrapping_add({i+1})); }}"]
                  return "\n".join(L + ["  acc", "}"]) + "\n"
              if family == "nested_if":
                  L = ["#![allow(unused)]", "fn step(x:u64)->u64{x.wrapping_add(1)}", "pub fn probe(mut acc:u64, a:bool, b:bool)->u64{"]
                  for i in range(n):
                      L += ["  if a {", "    if b {", f"      acc=step(acc.wrapping_add({i}));", "    } else {",
                            f"      acc=step(acc.wrapping_add({i+1}));", "    }", "  } else {",
                            f"    acc=step(acc.wrapping_add({i+2}));", "  }"]
                  return "\n".join(L + ["  acc", "}"]) + "\n"
              if family == "match_arms":
                  L = ["#![allow(unused)]", "fn step(x:u64)->u64{x.wrapping_add(1)}", "pub fn probe(mut acc:u64, k:u8)->u64{"]
                  for i in range(n):
                      L += ["  match k {",
                            f"    0 => {{ acc=step(acc.wrapping_add({i})); }}",
                            f"    1 => {{ acc=step(acc.wrapping_add({i+1})); }}",
                            f"    2 => {{ acc=step(acc.wrapping_add({i+2})); }}",
                            f"    _ => {{ acc=step(acc.wrapping_add({i+3})); }}", "  }"]
                  return "\n".join(L + ["  acc", "}"]) + "\n"
              if family == "loop_break_continue":
                  L = ["#![allow(unused)]", "fn step(x:u64)->u64{x.wrapping_add(1)}", "pub fn probe(mut acc:u64)->u64{"]
                  for i in range(n):
                      L += ["  loop {", f"    if acc > {i} {{ break; }}", "    acc = step(acc);",
                            f"    if acc == {i} {{ continue; }}", "    break;", "  }"]
                  return "\n".join(L + ["  acc", "}"]) + "\n"
              if family == "try_like":
                  L = ["#![allow(unused)]", "fn step(x:u64)->Option<u64>{Some(x.wrapping_add(1))}", "pub fn probe(mut acc:u64)->Option<u64>{"]
                  for i in range(n):
                      L += [f"  acc = step(acc.wrapping_add({i}))?;"]
                  return "\n".join(L + ["  Some(acc)", "}"]) + "\n"
              if family == "backedge_reinit":
                  L = ["#![allow(unused)]", "fn step(x:u64)->u64{x.wrapping_add(1)}", "pub fn probe(mut acc:u64)->u64{"]
                  for i in range(n):
                      L += ["  let mut t:u64;", "  loop {", f"    t = step(acc.wrapping_add({i}));", "    acc = t;", "    break;", "  }"]
                  return "\n".join(L + ["  acc", "}"]) + "\n"
              raise SystemExit(family)

          Path("case.rs").write_text(gen())

          def t(rustc):
              out = Path("o.rmeta")
              cmd = [rustc, "--edition", "2021", "--crate-type=lib", "--emit=metadata", "case.rs", "-o", str(out)]
              r = subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
              if r.returncode:
                  raise RuntimeError(r.stderr.decode()[-2000:])
              s = []
              for _ in range(3):
                  out.unlink(missing_ok=True)
                  t0 = time.perf_counter()
                  r = subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
                  if r.returncode:
                      raise RuntimeError(r.stderr.decode()[-2000:])
                  s.append(time.perf_counter() - t0)
              return s

          b, c = t("base/stage1/bin/rustc"), t("cand/stage1/bin/rustc")
          bm, cm = statistics.median(b), statistics.median(c)
          row = {"family": family, "n": n, "base_median_s": round(bm, 4), "cand_median_s": round(cm, 4),
                 "ratio": round(cm / bm, 4) if bm else None, "saving_s": round(bm - cm, 4)}
          Path("result.json").write_text(json.dumps(row, indent=2))
          print(json.dumps(row))
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(
              f"### {family} n={n}\nbase {bm:.3f} cand {cm:.3f} ratio {cm/bm:.3f}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cfg-${{ matrix.family }}-${{ matrix.n }}
          path: result.json

  report:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: cfg-*
      - run: |
          python3 <<'PY'
          import json, os
          from pathlib import Path
          rows = []
          for p in Path("all").rglob("result.json"):
              try:
                  rows.append(json.loads(p.read_text()))
              except Exception:
                  pass
          rows.sort(key=lambda r: (r.get("family", ""), r.get("n", 0)))
          Path("cfg-all.json").write_text(json.dumps(rows, indent=2))
          md = ["# CFG joins A/B", "", "| family | n | base | cand | ratio |", "| --- | ---: | ---: | ---: | ---: |"]
          for r in rows:
              md.append(f"| {r.get('family')} | {r.get('n')} | {r.get('base_median_s')} | {r.get('cand_median_s')} | {r.get('ratio')} |")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(md))
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cfg-aggregate
          path: cfg-all.json
