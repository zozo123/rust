name: EverInit hypotheses (candidate + A/B matrix)

on:
  workflow_dispatch:
  push:
    branches:
      - validation/everinit-ci
      - validation/everinit-hyp-**

permissions:
  contents: read

env:
  BASE_SHA: "09ee43b2d6055539771bee8ac30a6e56eb4db773"

jobs:
  build:
    name: "stage1 ${{ matrix.variant }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [base, candidate]
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/build-stage1.sh ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-${{ matrix.variant }}-hyp
          path: stage1-${{ matrix.variant }}.tar.gz
          retention-days: 3

  measure:
    name: "Hyp ${{ matrix.family }}/${{ matrix.n }}"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family:
          - same_local_loops
          - unique_locals
          - storage_dead_reuse
          - awaits
          - diamond_join
          - multi_assign_block
          - nested_loops
          - seq_loops
        n: [100, 200, 400, 800, 1200, 1600]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage1-candidate-hyp
          path: arts
      - uses: actions/download-artifact@v4
        with:
          name: stage1-base-hyp
          path: arts
      - name: Unpack + generate + A/B time
        run: |
          mkdir -p base cand
          tar -C cand -xzf arts/stage1-candidate.tar.gz
          tar -C base -xzf arts/stage1-base.tar.gz
          python3 <<'PY'
          from pathlib import Path
          import subprocess, time, statistics, json, os
          family, n = "${{ matrix.family }}", int("${{ matrix.n }}")

          def gen_same_local_loops(n):
              lines = ["#![allow(unused)]", "fn step(x: u64) -> u64 { x.wrapping_add(1) }", "pub fn probe(mut acc: u64) -> u64 {"]
              for _ in range(n):
                  lines += ["    loop {", "        acc = step(acc);", "        break;", "    }"]
              return "\n".join(lines + ["    acc", "}"]) + "\n"

          def gen_unique_locals(n):
              lines = ["#![allow(unused)]", "fn step(x: u64) -> u64 { x.wrapping_add(1) }", "pub fn probe() -> u64 {"]
              for i in range(n):
                  lines += [f"    let mut x{i}: u64;", "    loop {", f"        x{i} = step({i});", "        break;", "    }"]
              return "\n".join(lines + ["    " + " + ".join(f"x{i}" for i in range(n)), "}"]) + "\n"

          def gen_storage_dead_reuse(n):
              lines = ["#![allow(unused)]", "fn step(x: u64) -> u64 { x.wrapping_add(1) }", "pub fn probe() -> u64 {", "    let mut acc = 0u64;"]
              for _ in range(n):
                  lines += ["    {", "        let mut y: u64;", "        loop { y = step(acc); break; }", "        acc = y;", "    }"]
              return "\n".join(lines + ["    acc", "}"]) + "\n"

          def gen_awaits(n):
              lines = ["#![allow(unused)]", "async fn step(x: u64) -> u64 { x.wrapping_add(1) }", "pub async fn probe(t: &u64, mut acc: u64) -> u64 {"]
              for _ in range(n):
                  lines.append("    acc = step(acc.wrapping_add(*t)).await;")
              return "\n".join(lines + ["    acc", "}"]) + "\n"

          def gen_diamond_join(n):
              lines = ["#![allow(unused)]", "fn step(x: u64) -> u64 { x.wrapping_add(1) }", "pub fn probe(mut acc: u64, flag: bool) -> u64 {"]
              for i in range(n):
                  lines += ["    if flag {", f"        acc = step(acc.wrapping_add({i}));", "    } else {", f"        acc = step(acc.wrapping_add({i+1}));", "    }"]
              return "\n".join(lines + ["    acc", "}"]) + "\n"

          def gen_multi_assign_block(n):
              lines = ["#![allow(unused)]", "fn step(x: u64) -> u64 { x.wrapping_add(1) }", "pub fn probe(mut acc: u64) -> u64 {"]
              for i in range(n):
                  lines.append(f"    acc = step(acc.wrapping_add({i}));")
              return "\n".join(lines + ["    acc", "}"]) + "\n"

          def gen_nested_loops(n):
              outer, inner = max(1, int(n ** 0.5)), max(1, n // max(1, int(n ** 0.5)))
              lines = ["#![allow(unused)]", "fn step(x: u64) -> u64 { x.wrapping_add(1) }", "pub fn probe(mut acc: u64) -> u64 {"]
              for _ in range(outer):
                  lines.append("    loop {")
                  for _ in range(inner):
                      lines += ["        loop {", "            acc = step(acc);", "            break;", "        }"]
                  lines += ["        break;", "    }"]
              return "\n".join(lines + ["    acc", "}"]) + "\n"

          def gen_seq_loops(n):
              lines = ["#![allow(unused)]", "fn step(x: u64) -> u64 { x.wrapping_add(1) }", "pub fn probe(mut acc: u64) -> u64 {"]
              for i in range(n):
                  lines += [f"    while acc < {i} {{", "        acc = step(acc);", "        break;", "    }"]
              return "\n".join(lines + ["    acc", "}"]) + "\n"

          gens = {
              "same_local_loops": gen_same_local_loops, "unique_locals": gen_unique_locals,
              "storage_dead_reuse": gen_storage_dead_reuse, "awaits": gen_awaits,
              "diamond_join": gen_diamond_join, "multi_assign_block": gen_multi_assign_block,
              "nested_loops": gen_nested_loops, "seq_loops": gen_seq_loops,
          }
          Path("case.rs").write_text(gens[family](n))

          def time_compile(rustc, runs=3):
              out = Path("case.rmeta")
              cmd = [rustc, "--edition", "2021", "--crate-type=lib", "--emit=metadata", "case.rs", "-o", str(out)]
              r = subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
              if r.returncode:
                  raise RuntimeError(r.stderr.decode()[-2000:])
              samples = []
              for _ in range(runs):
                  out.unlink(missing_ok=True)
                  t0 = time.perf_counter()
                  r = subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
                  if r.returncode:
                      raise RuntimeError(r.stderr.decode()[-2000:])
                  samples.append(time.perf_counter() - t0)
              return samples

          b, c = time_compile("base/stage1/bin/rustc"), time_compile("cand/stage1/bin/rustc")
          bm, cm = statistics.median(b), statistics.median(c)
          row = {
              "family": family, "n": n,
              "base_median_s": round(bm, 4), "cand_median_s": round(cm, 4),
              "ratio": round(cm / bm, 4) if bm else None, "saving_s": round(bm - cm, 4),
              "base_samples": [round(s, 4) for s in b], "cand_samples": [round(s, 4) for s in c],
          }
          print(json.dumps(row))
          Path("result.json").write_text(json.dumps(row, indent=2))
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(
              f"### {family} n={n}\n\n- base **{bm:.3f}s** cand **{cm:.3f}s** ratio **{cm/bm:.3f}**\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hyp-${{ matrix.family }}-${{ matrix.n }}
          path: result.json

  report:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: hyp-*
      - name: Aggregate
        run: |
          python3 <<'PY'
          import json, os
          from pathlib import Path
          rows = []
          for p in Path("all").rglob("result.json"):
              try:
                  rows.append(json.loads(p.read_text()))
              except Exception:
                  pass
          rows.sort(key=lambda r: (r.get("family", ""), r.get("n", 0)))
          Path("hyp-all.json").write_text(json.dumps(rows, indent=2))
          md = ["# Hypotheses A/B", "", "| family | n | base | cand | ratio |", "| --- | ---: | ---: | ---: | ---: |"]
          for r in rows:
              if "error" in r:
                  md.append(f"| {r.get('family')} | {r.get('n')} | ERR | ERR | — |")
              else:
                  md.append(f"| {r['family']} | {r['n']} | {r['base_median_s']} | {r['cand_median_s']} | {r['ratio']} |")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(md))
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hyp-aggregate
          path: hyp-all.json
