# Deep dive: async await cliff (primary #159944 / #160033 signal).
name: EverInit await cliff A/B

on:
  workflow_dispatch:
  push:
    branches:
      - validation/everinit-ci
      - validation/everinit-await-**

permissions:
  contents: read

jobs:
  build:
    name: "stage1 ${{ matrix.variant }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            sha: "09ee43b2d6055539771bee8ac30a6e56eb4db773"
          - variant: candidate
            sha: "e7339de13da94243e4e0f0ee173be9be44164ab2"
    steps:
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/checkout@v4
        with:
          repository: rust-lang/rust
          ref: ${{ matrix.sha }}
          path: rust
          fetch-depth: 2
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libssl-dev python3 git curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cd rust
          cat > bootstrap.toml <<'TOML'
          change-id = 99999999
          profile = "compiler"
          [llvm]
          download-ci-llvm = true
          [build]
          docs = false
          extended = false
          tools = []
          [rust]
          channel = "dev"
          debug = false
          debuginfo-level = 0
          debuginfo-level-rustc = 0
          debuginfo-level-std = 0
          TOML
          python3 x.py build --stage 1 library -j"$(nproc)"
          tar -C build/host -czf ../stage1-${{ matrix.variant }}.tar.gz stage1
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-${{ matrix.variant }}
          path: stage1-${{ matrix.variant }}.tar.gz

  await-n:
    name: "awaits n=${{ matrix.n }}"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        n: [50, 100, 200, 300, 400, 500, 600, 700, 800, 1000, 1200, 1400, 1600, 2000, 2400]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage1-base
          path: arts
      - uses: actions/download-artifact@v4
        with:
          name: stage1-candidate
          path: arts
      - name: Time awaits@n
        run: |
          mkdir -p base cand
          tar -C base -xzf arts/stage1-base.tar.gz
          tar -C cand -xzf arts/stage1-candidate.tar.gz
          python3 <<'PY'
          import json, os, statistics, subprocess, time
          from pathlib import Path
          n=int("${{ matrix.n }}")
          lines=["#![allow(unused)]","async fn step(x: u64) -> u64 { x.wrapping_add(1) }",
                 "pub async fn probe(t: &u64, mut acc: u64) -> u64 {"]
          for _ in range(n):
              lines.append("    acc = step(acc.wrapping_add(*t)).await;")
          lines+=["    acc","}"]
          Path("case.rs").write_text("\n".join(lines)+"\n")

          def t(rustc, runs=3):
              out=Path("o.rmeta")
              cmd=[rustc,"--edition","2021","--crate-type=lib","--emit=metadata","case.rs","-o",str(out)]
              subprocess.run(cmd,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              s=[]
              for _ in range(runs):
                  out.unlink(missing_ok=True)
                  t0=time.perf_counter()
                  subprocess.run(cmd,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  s.append(time.perf_counter()-t0)
              return s

          b,c=t("base/stage1/bin/rustc"),t("cand/stage1/bin/rustc")
          bm,cm=statistics.median(b),statistics.median(c)
          row={"family":"awaits","n":n,"base_median_s":round(bm,4),"cand_median_s":round(cm,4),
               "ratio":round(cm/bm,4) if bm else None,"saving_s":round(bm-cm,4),
               "base_samples":[round(x,4) for x in b],"cand_samples":[round(x,4) for x in c]}
          Path("result.json").write_text(json.dumps(row,indent=2))
          print(json.dumps(row))
          open(os.environ["GITHUB_STEP_SUMMARY"],"a").write(
              f"### awaits n={n}\nbase **{bm:.3f}s** cand **{cm:.3f}s** ratio **{cm/bm:.3f}**\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: await-${{ matrix.n }}
          path: result.json

  # Hold-across-await style (dropck adjacency / #159943 scout)
  hold-n:
    name: "hold n=${{ matrix.n }}"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        n: [100, 250, 500, 750, 1000, 1500, 2000]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage1-base
          path: arts
      - uses: actions/download-artifact@v4
        with:
          name: stage1-candidate
          path: arts
      - uses: actions/checkout@v4
        with:
          repository: ashi009/rustc-async-borrowck-repros
          path: repros
          fetch-depth: 1
      - name: Prefer public hold_*.rs else generate
        run: |
          mkdir -p base cand
          tar -C base -xzf arts/stage1-base.tar.gz
          tar -C cand -xzf arts/stage1-candidate.tar.gz
          python3 <<'PY'
          import json, os, statistics, subprocess, time, shutil
          from pathlib import Path
          n=int("${{ matrix.n }}")
          # map known sizes
          known = {500:"hold_500.rs",1000:"hold_1000.rs",2000:"hold_2000.rs"}
          src = Path("repros")/known[n] if n in known else None
          if src is None or not src.exists():
              # simplified hold pattern: many awaits with a live binding
              lines=["#![allow(unused)]",
                     "async fn step(x: u64) -> u64 { x.wrapping_add(1) }",
                     "pub async fn probe(t: &u64) -> u64 {",
                     "    let guard = t;",
                     "    let mut acc = 0u64;"]
              for _ in range(n):
                  lines.append("    acc = step(acc.wrapping_add(*guard)).await;")
              lines+=["    acc","}"]
              Path("case.rs").write_text("\n".join(lines)+"\n")
          else:
              shutil.copy(src, "case.rs")

          def t(rustc):
              out=Path("o.rmeta")
              cmd=[rustc,"--edition","2021","--crate-type=lib","--emit=metadata","case.rs","-o",str(out)]
              subprocess.run(cmd,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              s=[]
              for _ in range(3):
                  out.unlink(missing_ok=True)
                  t0=time.perf_counter()
                  subprocess.run(cmd,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  s.append(time.perf_counter()-t0)
              return s
          b,c=t("base/stage1/bin/rustc"),t("cand/stage1/bin/rustc")
          bm,cm=statistics.median(b),statistics.median(c)
          row={"family":"hold","n":n,"base_median_s":round(bm,4),"cand_median_s":round(cm,4),
               "ratio":round(cm/bm,4) if bm else None,"saving_s":round(bm-cm,4)}
          Path("result.json").write_text(json.dumps(row,indent=2))
          print(json.dumps(row))
          open(os.environ["GITHUB_STEP_SUMMARY"],"a").write(
              f"### hold n={n}\nbase {bm:.3f} cand {cm:.3f} ratio {cm/bm:.3f}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hold-${{ matrix.n }}
          path: result.json

  report:
    needs: [await-n, hold-n]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
      - name: Cliff report
        run: |
          python3 <<'PY'
          import json, os
          from pathlib import Path
          rows=[]
          for p in Path("all").rglob("result.json"):
              try: rows.append(json.loads(p.read_text()))
              except: pass
          rows.sort(key=lambda r:(r.get("family",""), r.get("n",0)))
          Path("await-cliff-all.json").write_text(json.dumps(rows,indent=2))
          md=["# Await / hold cliff","",
              "| family | n | base | cand | ratio | saving |",
              "| --- | ---: | ---: | ---: | ---: | ---: |"]
          for r in rows:
              md.append(f"| {r.get('family')} | {r.get('n')} | {r.get('base_median_s')} | {r.get('cand_median_s')} | {r.get('ratio')} | {r.get('saving_s')} |")
          # Superlinearity check on base awaits
          awaits=[r for r in rows if r.get("family")=="awaits" and "ratio" in r]
          if len(awaits)>=2:
              a=sorted(awaits,key=lambda x:x["n"])
              md+=["","## Superlinearity scout (base)",""]
              for i in range(1,len(a)):
                  n0,n1=a[i-1]["n"],a[i]["n"]
                  b0,b1=a[i-1]["base_median_s"],a[i]["base_median_s"]
                  c0,c1=a[i-1]["cand_median_s"],a[i]["cand_median_s"]
                  if n0 and b0:
                      md.append(f"- n {n0}→{n1}: base×{b1/b0:.2f} cand×{c1/c0:.2f} (n×{n1/n0:.2f})")
          text="\n".join(md)
          print(text)
          open(os.environ["GITHUB_STEP_SUMMARY"],"a").write(text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: await-cliff-aggregate
          path: await-cliff-all.json
