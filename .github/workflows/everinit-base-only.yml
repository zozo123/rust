name: EverInit base-only MCVE sweep

on:
  workflow_dispatch:
  # push disabled: exploratory only; use everinit-valid-ab.yml for pinned A/B

permissions:
  contents: read

env:
  BASE_SHA: "09ee43b2d6055539771bee8ac30a6e56eb4db773"

jobs:
  build-and-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Build base stage1
        run: bash .github/scripts/build-stage1.sh base
      - uses: actions/checkout@v4
        with:
          repository: ashi009/rustc-async-borrowck-repros
          path: repros
          fetch-depth: 1
      - name: Generate extra scaling sources
        run: |
          python3 <<'PY'
          from pathlib import Path
          def awaits(n):
              L = ["#![allow(unused)]", "async fn step(x: u64) -> u64 { x.wrapping_add(1) }",
                   "pub async fn probe(t: &u64, mut acc: u64) -> u64 {"]
              for _ in range(n):
                  L.append("    acc = step(acc.wrapping_add(*t)).await;")
              Path(f"repros/gen_awaits_{n}.rs").write_text("\n".join(L + ["    acc", "}"]) + "\n")
          for n in (100, 200, 300, 500, 700, 900, 1100, 1300, 1500):
              awaits(n)
          print("generated")
          PY
      - name: Time MCVEs
        run: |
          tar -xzf stage1-base.tar.gz
          RUSTC="$PWD/stage1/bin/rustc"
          $RUSTC -vV
          python3 <<'PY'
          import subprocess, time, statistics, json
          from pathlib import Path
          rustc = "stage1/bin/rustc"
          rows = []
          for src in sorted(Path("repros").glob("*.rs")):
              samples = []
              out = Path("t.rmeta")
              cmd = [rustc, "--edition", "2021", "--crate-type=lib", "--emit=metadata", str(src), "-o", str(out)]
              try:
                  subprocess.run(cmd, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              except Exception as e:
                  rows.append({"src": src.name, "error": str(e)})
                  continue
              for _ in range(3):
                  out.unlink(missing_ok=True)
                  t0 = time.perf_counter()
                  subprocess.run(cmd, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  samples.append(time.perf_counter() - t0)
              med = statistics.median(samples)
              rows.append({"src": src.name, "median_s": round(med, 4), "samples": [round(s, 4) for s in samples]})
              print(src.name, med)
          Path("base-results.json").write_text(json.dumps(rows, indent=2))
          md = ["### Base-only MCVE sweep", ""]
          for r in rows:
              if "error" in r:
                  md.append(f"- `{r['src']}`: ERR")
              else:
                  md.append(f"- `{r['src']}`: {r['median_s']:.3f}s")
          open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(md) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: base-only-results
          path: base-results.json
