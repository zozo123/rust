name: EverInit base-only MCVE sweep

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base rustc SHA"
        required: true
        default: "09ee43b2d6055539771bee8ac30a6e56eb4db773"
  push:
    branches:
      - validation/everinit-base-**

permissions:
  contents: read

jobs:
  build-and-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - uses: actions/checkout@v4
        with:
          repository: rust-lang/rust
          ref: ${{ github.event.inputs.base_sha || '09ee43b2d6055539771bee8ac30a6e56eb4db773' }}
          path: rust
          fetch-depth: 1

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libssl-dev python3 git curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configure + build stage1
        working-directory: rust
        run: |
          cat > bootstrap.toml <<'TOML'
          change-id = 99999999
          profile = "compiler"
          [llvm]
          download-ci-llvm = true
          [build]
          docs = false
          extended = false
          tools = []
          [rust]
          channel = "dev"
          debug = false
          debuginfo-level = 0
          debuginfo-level-rustc = 0
          debuginfo-level-std = 0
          TOML
          python3 x.py build --stage 1 library -j"$(nproc)"

      - uses: actions/checkout@v4
        with:
          repository: ashi009/rustc-async-borrowck-repros
          path: repros

      - name: Time MCVEs
        run: |
          RUSTC="$PWD/rust/build/host/stage1/bin/rustc"
          $RUSTC -vV
          python3 <<'PY'
          import subprocess, time, statistics, json
          from pathlib import Path
          rustc = "rust/build/host/stage1/bin/rustc"
          rows=[]
          for src in sorted(Path("repros").glob("*.rs")):
              samples=[]
              out=Path("t.rmeta")
              cmd=[rustc,"--edition","2021","--crate-type=lib","--emit=metadata",str(src),"-o",str(out)]
              subprocess.run(cmd,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              for _ in range(3):
                  out.unlink(missing_ok=True)
                  t0=time.perf_counter()
                  subprocess.run(cmd,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  samples.append(time.perf_counter()-t0)
              med=statistics.median(samples)
              rows.append({"src":src.name,"median_s":round(med,4),"samples":[round(s,4) for s in samples]})
              print(src.name, med)
          Path("base-results.json").write_text(json.dumps(rows,indent=2))
          md=["### Base-only MCVE sweep",""]
          for r in rows:
              md.append(f"- `{r['src']}`: {r['median_s']:.3f}s")
          open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a").write("\n".join(md)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: base-only-results
          path: base-results.json
