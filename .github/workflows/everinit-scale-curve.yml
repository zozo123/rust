# Fine-grained N scaling for awaits + same-local (primary #160033 smoking gun).
# Builds both toolchains once, then ~24 parallel scale points.
name: EverInit scale curve A/B

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base rustc SHA"
        required: true
        default: "09ee43b2d6055539771bee8ac30a6e56eb4db773"
      candidate_sha:
        description: "Candidate SHA"
        required: true
        default: "e7339de13da94243e4e0f0ee173be9be44164ab2"
  push:
    branches:
      - validation/everinit-ci
      - validation/everinit-scale-**

permissions:
  contents: read

jobs:
  build:
    name: "stage1 ${{ matrix.variant }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            default_sha: "09ee43b2d6055539771bee8ac30a6e56eb4db773"
          - variant: candidate
            default_sha: "e7339de13da94243e4e0f0ee173be9be44164ab2"
    steps:
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - name: Resolve SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ matrix.variant }}" = "base" ]; then
              echo "sha=${{ github.event.inputs.base_sha }}" >> "$GITHUB_OUTPUT"
            else
              echo "sha=${{ github.event.inputs.candidate_sha }}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "sha=${{ matrix.default_sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: rust-lang/rust
          ref: ${{ steps.sha.outputs.sha }}
          path: rust
          fetch-depth: 2
      - name: Deps + build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libssl-dev python3 git curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cd rust
          cat > bootstrap.toml <<'TOML'
          change-id = 99999999
          profile = "compiler"
          [llvm]
          download-ci-llvm = true
          [build]
          docs = false
          extended = false
          tools = []
          [rust]
          channel = "dev"
          debug = false
          debuginfo-level = 0
          debuginfo-level-rustc = 0
          debuginfo-level-std = 0
          incremental = false
          dist-src = false
          TOML
          python3 x.py build --stage 1 library -j"$(nproc)"
          tar -C build/host -czf ../stage1-${{ matrix.variant }}.tar.gz stage1
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-${{ matrix.variant }}
          path: stage1-${{ matrix.variant }}.tar.gz
          retention-days: 4

  point:
    name: "${{ matrix.family }}@${{ matrix.n }}"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        family: [awaits, same_local_loops, unique_locals]
        n: [25, 50, 75, 100, 150, 200, 300, 400, 600, 800, 1000, 1400, 1800, 2400]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage1-base
          path: arts
      - uses: actions/download-artifact@v4
        with:
          name: stage1-candidate
          path: arts
      - name: Measure point
        run: |
          mkdir -p base cand
          tar -C base -xzf arts/stage1-base.tar.gz
          tar -C cand -xzf arts/stage1-candidate.tar.gz
          python3 <<'PY'
          import json, os, statistics, subprocess, time
          from pathlib import Path
          family, n = "${{ matrix.family }}", int("${{ matrix.n }}")

          def gen():
              if family == "awaits":
                  L = ["#![allow(unused)]","async fn step(x: u64) -> u64 { x.wrapping_add(1) }",
                       "pub async fn probe(t: &u64, mut acc: u64) -> u64 {"]
                  for _ in range(n):
                      L.append("    acc = step(acc.wrapping_add(*t)).await;")
                  return "\n".join(L+["    acc","}"])+"\n"
              if family == "unique_locals":
                  L = ["#![allow(unused)]","fn step(x: u64) -> u64 { x.wrapping_add(1) }","pub fn probe() -> u64 {"]
                  for i in range(n):
                      L += [f"    let mut x{i}: u64;","    loop {",f"        x{i} = step({i});","        break;","    }"]
                  return "\n".join(L+["    "+" + ".join(f"x{i}" for i in range(n)),"}"])+"\n"
              L = ["#![allow(unused)]","fn step(x: u64) -> u64 { x.wrapping_add(1) }","pub fn probe(mut acc: u64) -> u64 {"]
              for _ in range(n):
                  L += ["    loop {","        acc = step(acc);","        break;","    }"]
              return "\n".join(L+["    acc","}"])+"\n"

          Path("case.rs").write_text(gen())

          def t(rustc, runs=3):
              out=Path("o.rmeta")
              cmd=[rustc,"--edition","2021","--crate-type=lib","--emit=metadata","case.rs","-o",str(out)]
              subprocess.run(cmd,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              s=[]
              for _ in range(runs):
                  out.unlink(missing_ok=True)
                  t0=time.perf_counter()
                  subprocess.run(cmd,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  s.append(time.perf_counter()-t0)
              return s

          try:
              b,c = t("base/stage1/bin/rustc"), t("cand/stage1/bin/rustc")
          except Exception as e:
              Path("result.json").write_text(json.dumps({"family":family,"n":n,"error":str(e)[:1500]},indent=2))
              raise
          bm,cm = statistics.median(b), statistics.median(c)
          row={"family":family,"n":n,"base_median_s":round(bm,4),"cand_median_s":round(cm,4),
               "ratio":round(cm/bm,4) if bm else None,"saving_s":round(bm-cm,4)}
          Path("result.json").write_text(json.dumps(row,indent=2))
          print(json.dumps(row))
          open(os.environ["GITHUB_STEP_SUMMARY"],"a").write(
              f"### {family} n={n}\nbase {bm:.3f}s · cand {cm:.3f}s · ratio {cm/bm:.3f}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scale-${{ matrix.family }}-${{ matrix.n }}
          path: result.json

  report:
    needs: point
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: scale-*
      - name: Curve summary
        run: |
          python3 <<'PY'
          import json, os
          from pathlib import Path
          from collections import defaultdict
          rows=[]
          for p in Path("all").rglob("result.json"):
              try: rows.append(json.loads(p.read_text()))
              except: pass
          rows=[r for r in rows if "error" not in r]
          by=defaultdict(list)
          for r in rows: by[r["family"]].append(r)
          md=["# Scale curves (base vs #160033)",""]
          for fam, items in sorted(by.items()):
              items.sort(key=lambda x:x["n"])
              md += [f"## {fam}","",
                     "| n | base (s) | cand (s) | ratio |",
                     "| ---: | ---: | ---: | ---: |"]
              for r in items:
                  md.append(f"| {r['n']} | {r['base_median_s']} | {r['cand_median_s']} | {r['ratio']} |")
              md.append("")
          text="\n".join(md)
          print(text)
          open(os.environ["GITHUB_STEP_SUMMARY"],"a").write(text)
          Path("scale-all.json").write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scale-curve-aggregate
          path: scale-all.json
